name: Publish external report pages

on:
  push:
    branches: [main]
    paths:
      - "data/*.html"
      - "data/*.csv"
      - "data/*.json"
      - ".github/workflows/publish-report-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout report artifacts
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload report site
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./data

      - name: Deploy report site
        id: deployment
        uses: actions/deploy-pages@v4
