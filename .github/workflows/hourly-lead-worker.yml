name: Hourly lead worker

on:
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch:
    inputs:
      target_per_run:
        description: "Maximum stores to qualify in this run"
        required: false
        default: "84"
        type: string
      dry_run:
        description: "Start safely without public-source requests"
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: hourly-lead-worker
  cancel-in-progress: false

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      DATABASE_NAME: "AVG9nkaNzsHswcdcXYfrKU"
      WORKER_INTERVAL_MINUTES: "60"
      WORKER_TARGET_PER_RUN: ${{ inputs.target_per_run || '84' }}
      WORKER_DRY_RUN: ${{ inputs.dry_run || 'false' }}
      WORKER_ONCE: "true"
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up pnpm
        uses: pnpm/action-setup@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Ensure database name is present
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const url = new URL(process.env.DATABASE_URL);
          if (!url.pathname || url.pathname === '/') {
            url.pathname = `/${process.env.DATABASE_NAME}`;
            fs.appendFileSync(process.env.GITHUB_ENV, `DATABASE_URL=${url.toString()}\n`);
          }
          NODE
      - name: Apply database migrations
        run: pnpm drizzle-kit migrate
      - name: Run one worker cycle
        run: pnpm worker
