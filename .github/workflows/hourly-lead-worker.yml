name: Hourly lead worker

on:
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch:
    inputs:
      target_per_run:
        description: "Maximum stores to qualify in this run"
        required: false
        default: "84"
        type: string
      dry_run:
        description: "Start safely without public-source requests"
        required: false
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: hourly-lead-worker
  cancel-in-progress: false

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      WORKER_STORAGE: "repository"
      WORKER_INTERVAL_MINUTES: "60"
      WORKER_TARGET_PER_RUN: ${{ inputs.target_per_run || '84' }}
      WORKER_DRY_RUN: ${{ inputs.dry_run || 'false' }}
      WORKER_ONCE: "true"
      AUTO_DISPATCH: ${{ secrets.AUTO_DISPATCH || 'false' }}
      LOCAL_WEBHOOK_ENDPOINT: ${{ secrets.LOCAL_WEBHOOK_ENDPOINT }}
      LOCAL_WEBHOOK_TOKEN: ${{ secrets.LOCAL_WEBHOOK_TOKEN }}
      LOCAL_WEBHOOK_ALLOWED_HOST: ${{ secrets.LOCAL_WEBHOOK_ALLOWED_HOST }}
      DISPATCH_INTERVAL_MS: "43000"
      DISPATCH_MAX_PER_RUN: "84"
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up pnpm
        uses: pnpm/action-setup@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Run one worker cycle
        run: pnpm worker
      - name: Commit hourly reports
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          git diff --cached --quiet || git commit -m "Update hourly lead reports"
          git push
